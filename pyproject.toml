[project]
name = "vibetrading"
version = "0.1.0"
description = "AI agent platform for trading Indian markets via Dhan"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "httpx>=0.27",
    "litellm>=1.52",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "cryptography>=43.0",
    "fastapi-users[sqlalchemy]>=15.0",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "tenacity>=9.0",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dhan = [
    "dhanhq>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vibetrading*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# C408: dict(...) + .update(overrides) is a deliberate test-fixture idiom
# throughout tests/ for building override-able default kwargs.
# B008: Depends(...)/Form(...) in argument defaults is required FastAPI
# dependency-injection style, not a bug, throughout api/ and dashboard/.
ignore = ["C408", "B008"]
