name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Backs tests/unit/test_redis_bus.py's cross-worker fan-out coverage
      # (Phase 21) -- those tests skip cleanly without it, but running them
      # for real here is what actually proves the Redis pub/sub wiring
      # works before merge, not just that it degrades gracefully without.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check vibetrading/ tests/ scripts/

      - name: Test (SQLite, fast unit/integration tier)
        run: pytest

  test-postgres:
    # A second full run of the same suite against a real Postgres service
    # container -- SQLite doesn't enforce foreign keys or distinguish
    # timezone-aware from naive timestamps by default, so issues in either
    # area (see the tenant_id FKs and the DateTime(timezone=True) columns)
    # only surface here, not in the SQLite tier above. Catches Postgres/
    # migration dialect drift before merge, per Phase 19's DoD.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vibetrading
          POSTGRES_PASSWORD: vibetrading
          POSTGRES_DB: vibetrading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://vibetrading:vibetrading@localhost:5432/vibetrading_test
      DATABASE_URL: postgresql+asyncpg://vibetrading:vibetrading@localhost:5432/vibetrading_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Alembic upgrade head against clean Postgres
        run: alembic upgrade head

      - name: Test (Postgres tier)
        run: pytest

  docker-publish:
    # Builds and pushes the image every push to main uses in
    # production (Dockerfile, render.yaml) to GHCR -- gated on both test
    # jobs passing first, so a broken build/test never gets tagged as
    # deployable. Pull requests never publish; only a merge to main does.
    needs: [test, test-postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
