<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VibeTrading{% block title %}{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">VibeTrading</div>
    <nav>
      <a href="/" class="{{ 'active' if active_page == 'watchlist' else '' }}">Strategy</a>
      <a href="/risk" class="{{ 'active' if active_page == 'risk' else '' }}">Risk</a>
      <a href="/backtest" class="{{ 'active' if active_page == 'backtest' else '' }}">Backtest</a>
      <a href="/monitor" class="{{ 'active' if active_page == 'monitor' else '' }}">Monitor</a>
      <a href="/settings" class="{{ 'active' if active_page == 'settings' else '' }}">Settings</a>
    </nav>
    {% set dom_id = "nav-mode-control" %}
    {% include "_mode_control.html" %}
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <div id="ws-indicator" class="ws-indicator" title="Live update connection">●</div>
  <script src="/static/js/app.js"></script>
</body>
</html>
