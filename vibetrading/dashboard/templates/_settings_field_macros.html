{% macro render_field(field, settings) %}
<label class="settings-field">
  <span>{{ field.label }}</span>
  {% if field.secret %}
    {% set is_set = settings | attr(field.key) %}
    <input
      type="password"
      name="{{ field.key }}"
      value=""
      autocomplete="new-password"
      placeholder="{{ '•••• (configured)' if is_set else '(not set)' }}"
    />
    <span class="settings-clear">
      <label><input type="checkbox" name="clear__{{ field.key }}" /> Clear</label>
    </span>
  {% elif field.type.__name__ == "bool" %}
    <input type="checkbox" name="{{ field.key }}" {{ "checked" if settings | attr(field.key) else "" }} />
  {% elif field.choices %}
    <select name="{{ field.key }}">
      {% set current = settings | attr(field.key) %}
      {% for choice in field.choices %}
      <option value="{{ choice }}" {{ "selected" if current == choice else "" }}>{{ choice }}</option>
      {% endfor %}
    </select>
  {% elif field.type.__name__ == "int" %}
    <input type="number" step="1" name="{{ field.key }}" value="{{ settings | attr(field.key) }}" />
  {% elif field.type.__name__ == "float" %}
    <input type="number" step="any" name="{{ field.key }}" value="{{ settings | attr(field.key) }}" />
  {% else %}
    <input type="text" name="{{ field.key }}" value="{{ settings | attr(field.key) }}" />
  {% endif %}
  {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
</label>
{% endmacro %}
