{% import "_settings_field_macros.html" as macros %}
<section class="card" id="settings-data_sources">
  <h2>Data Sources</h2>
  <p class="settings-section-desc">
    Each real source is off by default — enable one only once you've confirmed your use is
    allowed under its terms of service.
  </p>
  <form hx-post="/settings/save/data_sources" hx-target="#settings-data_sources" hx-swap="outerHTML">
    <div class="settings-grid">
      {% for field in sections.data_sources %}
        {{ macros.render_field(field, settings) }}
      {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</section>
