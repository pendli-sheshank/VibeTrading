{% extends "auth_base.html" %}
{% block title %} — Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>

{% if registered %}
<p class="badge badge-ok">Account created — sign in below.</p>
{% endif %}
{% if error %}
<p class="badge badge-danger">{{ error }}</p>
{% endif %}

<form method="post" action="/login" class="auth-form">
  <label class="settings-field">
    <span>Email</span>
    <input type="email" name="username" required autofocus />
  </label>
  <label class="settings-field">
    <span>Password</span>
    <input type="password" name="password" required />
  </label>
  <button type="submit" class="btn btn-primary">Sign in</button>
</form>

<p class="muted auth-footer">No account? <a href="/register">Create one</a></p>
{% endblock %}
